# Two allowlists read by the decision-relay cross ledger (`status --cross`) and by doctor.
# They do NOT gate which ordinary `.propagates.yml` edges fire: those fire across repos with
# no allowlist (propagate#117). Doctor reads `partner_roots` (realpath'd, existing roots only,
# minus any root that contains the hub) as the SHARED PLATFORM ROOTS: an edge joining two
# different client workspaces is a doctor failure unless one end is under one of them.
# partner_roots: absolute repo roots; a root listed here is a shared platform, not a client.
partner_roots: []
# ^ EMPTY BY DEFAULT, and that is the safe default: an empty allowlist permits no
# cross-repo edge, so a fresh install cannot fire one it was never configured for.
#
# This file SHIPS with the skill, so anything listed here reaches every machine.
# It used to carry three of the author's absolute repo roots — paths that resolve
# nowhere else, in the very file whose job is to BOUND what a cross edge may reach.
#
# Put your real list in $PROPAGATE_STATE_DIR/cross-allow.yml (default
# ~/.propagate/cross-allow.yml); lib/config.mjs prefers it over this one whenever it
# exists. Example:
#
#   partner_roots:
#     - ~/code/some-service
#     - ~/code/some-other-repo
# contract_files: glob suffixes a cross edge target may match (the "major" filter).
contract_files:
  - "motherboard.json"
  - "**/plugin-sdk/**"
  - "**/routes/**"
  - "scripts/**"
  - "**/ga4-property.yaml"
  - "**/DESIGN_SYSTEM_PLAYBOOK.md"
  - "**/ui/**"
# partner_aliases: normalized partner name <- the strings that mean it (paths + Affects: tokens).
# Shared by resolvePartner() so the file trigger (Slice 1) and the future decision
# trigger (Slice 2) agree what a "partner" is. Matched case-insensitively, after trimming.
partner_aliases:
  # NOTE: aliases are matched as substrings (paths need it), so keep them long enough
  # to avoid false positives. Bare "mb" was dropped — it matches inside words like
  # "number". Every alias here is >=6 chars / distinctive.
  Motherboard: [motherboard, "vipinkaushik-mb", "vipin kaushik"]
  Tathya: [tathya, "tathya-mb"]
  SSJK: ["ssjk-mb", "shree shyam", "pandit pawan"]
