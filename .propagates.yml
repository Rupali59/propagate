# propagate's own couplings.
#
# Reachable from the hub via the `propagate-skill` -> ~/.claude/skills/propagate
# symlink, exactly as the rules layer is reached via `rules` -> ~/.claude/rules.
# Until this file existed, `doctor` reported that symlink as "no marker —
# nothing lost", which was true only because nothing had been declared: the
# skill that exists to catch undeclared couplings had none of its own.
#
# That is `rule:adversarial-review-reads-the-ledger`'s exact finding — a green
# propagate on an undeclared tree means "not looking", not "clean" — and the
# 2026-08-17 graph work is what made it visible, because `graph` reports the
# whole workspace and this one had zero edges in it.
#
# NOT a `workspace: true` marker: this directory must not own a ledger. It is an
# edge-only marker, so its drift is reported into the hub's ledger rather than
# creating an eighth workspace-root ledger for a directory that is not a
# workspace.

# ON WHAT IS DELIBERATELY *NOT* DECLARED HERE.
#
# `cli.mjs` -> `docs/REFERENCE.md` is a real coupling and is still not declared, because
# the edge would be worse than the gap. Measured over 30 days: cli.mjs changed in 46
# commits, REFERENCE.md in 7. A file-level edge fires 46 times to be right about 7, and a
# check with a 6.5:1 false-positive rate trains people to ignore it -- which is how a
# working check becomes decorative.
#
# The god-file IS the coverage problem. Once commands move into lib modules (reviewed
# plan, D7), `lib/core/setup.mjs -> docs/REFERENCE.md` becomes precise and cheap, which is
# exactly why the three edges below could be declared today and cli.mjs could not.
# Tracked in docs/ISSUES.md.

sources:
  docs/REFERENCE.md:
    propagates_to:
      - path: ../.templates/NEW-PROJECT-CHECKLIST.md
        why: >-
          REFERENCE.md's "Ledger layout" section is canonical for where propagation items
          live. This checklist tells whoever adds a workspace what to create, so a layout
          change here that does not reach it manufactures the old shape for every future
          project. Measured 2026-08-21: 50 files carried a hardcoded ledger path and this
          checklist was one of exactly two that would keep producing more.
        kind: prose
      - path: ../rules/model-routing.md
        why: >-
          model-routing tells every subagent brief to run /propagate so its work reaches the
          workspace ledger. Until 2026-08-21 it named `docs/PROPAGATION_LEDGER.md` outright and
          was wrong the moment the layout moved - a live imperative, injected into every session
          by the SessionStart hook, misinstructing every agent that read it. It now references
          REFERENCE.md instead of naming a path, and this edge is what makes that reference stay
          true: a pointer nothing watches is exactly how it went stale.
        kind: prose
      - path: ../.templates/RETIREMENT-CHECKLIST.md
        why: >-
          The retirement path names the ledger it must account for before a workspace is
          archived. If the layout moves and this does not, a retiring workspace's ledger
          history is looked for where it no longer is - the one moment nobody gets a second
          chance to find it.
        kind: prose
  propagates.schema.json:
    propagates_to:
      - path: skills/propagate/sections/reconcile.md
        why: >-
          reconcile's `declare` workflow shows the sidecar shape a user must write. The
          schema is additionalProperties:false, so a field added here and not documented
          there is a field whose absence silently rejects the whole sidecar.
        kind: code
      - path: docs/REFERENCE.md
        why: >-
          REFERENCE documents the sidecar keys operators actually type. Schema and
          reference disagreeing means a documented key that does not validate.
        kind: code
  lib/core/setup.mjs:
    propagates_to:
      - path: docs/REFERENCE.md
        why: >-
          REFERENCE § Install carries the outcome table (ok / no-roots / roots-missing /
          no-markers / markers-rejected) and each one's fix. Adding an outcome without
          adding its row leaves a stranger with a failure and no next step.
        kind: code
      - path: SKILL.md
        why: >-
          SKILL.md's Setup section is the four-step sequence a fresh install follows. It
          exists because a fresh agent got through setup and reported the install broken.
        kind: code
  lib/rules/rules-check.mjs:
    propagates_to:
      - path: skills/propagate/sections/routing.md
        why: >-
          routing documents what `rules check` exits non-zero on — including that it
          fails when it scanned NOTHING. That promise is a property of this file.
        kind: code
  VERSION:
    propagates_to:
      - path: package.json
        why: >-
          The release version is stated in four places and must be one fact. A bump that
          misses one ships a plugin whose manifest version does not match its code.
        kind: code
      - path: .claude-plugin/plugin.json
        why: >-
          The marketplace displays this version. If it lags VERSION, users install what
          they think is current and get something older, with no signal either way.
        kind: code
      - path: .claude-plugin/marketplace.json
        why: >-
          Install resolves through this manifest, so a stale version here is the one a
          stranger actually receives.
        kind: code
  lib/graph/graph.mjs:
    propagates_to:
      - path: skills/propagate/sections/routing.md
        why: >-
          routing documents `graph`'s worklist semantics — that NEVER_VERIFIED is
          excluded by default but still blocks, and that the fix order is by source
          layer. Those are properties of fixOrder/blockedBy, not prose. If the
          derivation changes, the promise in routing/SKILL.md is the thing that goes
          stale.
        kind: code
      - path: docs/DECISIONS.md
        why: >-
          The 2026-08-17 entry states layering is longest-path-from-root and that
          cycles are condensed rather than dropped. Both are decisions the code has
          to keep; if the code stops keeping one, the record is wrong rather than
          merely out of date.
        kind: code

  lib/report/metrics.mjs:
    propagates_to:
      - path: docs/OBSERVABILITY.md
        why: >-
          OBSERVABILITY.md §1 is the table of what is measured and what range is
          expected. EXPECTATIONS is the executable form of that table; an entry
          added or recalibrated in one and not the other is the "looks
          machine-checked and is not" failure.
        kind: code
      - path: docs/GOTCHAS.md
        why: >-
          Every EXPECTATIONS entry's `basis` cites a dated incident, and the long
          form of those incidents lives in GOTCHAS. A threshold whose story is only
          in the code gets re-litigated the first time someone disagrees with it.
        kind: prose

  lib/edges/events.mjs:
    propagates_to:
      - path: docs/DATA_MODEL.md
        why: >-
          DATA_MODEL.md describes the record shapes on disk. events.mjs owns the v2
          shape and its validation rules (which dispositions pin content, which
          require a reason). DATA_MODEL.md is currently descriptive of v1 only —
          this edge is what should fire when that gap is closed.
        kind: code

  # Added 2026-08-17 with the docs themselves, per
  # rule:refactor-updates-sidecar-same-commit. LIFECYCLE.md's whole subject is
  # the state machines these three files implement; a state added or renamed in
  # any of them falsifies the diagram silently, which is the exact drift the
  # document warns about.
  docs/LIFECYCLE.md:
    propagates_to:
      - path: lib/edges/reconcile.mjs
        why: >-
          LIFECYCLE.md draws the edge machine's states; reconcile.mjs is where
          STATES is defined and where the transitions are derived. The doc names
          all eight — a ninth, or a rename, makes the diagram wrong.
        kind: code
      - path: lib/edges/events.mjs
        why: >-
          the dispositions in the diagram (baselined, decoupled) are DISPOSITIONS
          entries; adding or removing one changes what transitions exist
        kind: code
      - path: lib/skills/skills-lifecycle.mjs
        why: >-
          LIFECYCLE.md states the skill machine's thresholds (3 uses to promote,
          reaped at 14d). Those are PROMOTE_MIN_USES and REAP_AFTER_DAYS; the doc
          quotes them and they are exactly the kind of constant that gets tuned.
        kind: code

  docs/AUDIT-2026-08.md:
    propagates_to:
      - path: docs/GOTCHAS.md
        why: >-
          the audit assigns a disposition to each entry and records which are
          COVERED, RETIRED or DELIVERED. Entries added or superseded in GOTCHAS
          leave the table describing a corpus that no longer exists.
        kind: prose
